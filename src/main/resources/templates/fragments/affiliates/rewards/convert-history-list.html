<div
    th:fragment="content(affiliateId, rewardConvertHistoryList, pageInfo, currOrder)"
    id="affiliate-reward-convert-history-list"
    class="affiliate-reward-convert-history-list"
>
    <div th:if="${affiliateId == null}" class="affiliate-reward-convert-history-list-container">
        <div class="common-title-md">리워드 전환 내역</div>
        <div class="common-title-md">← 제휴사를 선택하세요</div>
    </div>
    <div th:if="${affiliateId != null}" class="affiliate-reward-convert-history-list-container">
        <div class="affiliate-reward-convert-history-list-top">
            <div class="common-title-md">리워드 전환 내역</div>
            <select
                class="common-dropdown-list"
                th:onchange="|showRewardConvertHistoryList(${affiliateId}, ${pageInfo.currPage}, ${pageInfo.pageSize}, this.value)|"
            >
                <option class="common-dropdown-item" value="date-asc" th:selected="${currOrder == 'date-asc'}">오래된순</option>
                <option class="common-dropdown-item" value="date-desc" th:selected="${currOrder == 'date-desc'}">최신순</option>
                <option class="common-dropdown-item" value="rewards-asc" th:selected="${currOrder == 'rewards-asc'}">전환 후 리워드 적은 순</option>
                <option class="common-dropdown-item" value="rewards-desc" th:selected="${currOrder == 'rewards-desc'}">전환 후 리워드 많은 순</option>
            </select>
        </div>
        <table class="common-table">
            <thead>
            <tr>
                <th style="width: 8%">순번</th>
                <th style="width: 32%">전환 일시</th>
                <th style="width: 16%">전환 포인트(점)</th>
                <th style="width: 12%">전환 비율</th>
                <th style="width: 20%">전환 후 리워드(개)</th>
                <th style="width: 22%">전환 상태</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="h, iterStat : ${rewardConvertHistoryList}">
                <td th:text="${iterStat.index + ((pageInfo.currPage - 1) * pageInfo.pageSize) + 1}"></td>
                <td th:text="${#temporals.format(#temporals.createDateTime(h.convertDatetime, 'yyyy-MM-dd HH:mm:ss'), 'y년 M월 d일 a h시 m분 s초')}"></td>
                <td th:text="${h.convertTargetPoint}"></td>
                <td th:text="${h.convertRate}"></td>
                <td th:text="${h.convertedReward}"></td>
                <td th:text="${h.statCode == 'SUCCESS' ? '전환완료' : (h.statCode == 'FAIL' ? '전환실패' : '미전환')}"></td>
            </tr>
            </tbody>
        </table>
        <div class="common-page-btn-row"
            th:with="
                startPageOrig=${pageInfo.currPage - 3}
                , endPageOrig=${pageInfo.currPage + 3}
                , startPageShortfall=${startPageOrig < 1 ? 1 - startPageOrig : 0}
                , endPageShortfall=${endPageOrig > pageInfo.totalPages ? endPageOrig - pageInfo.totalPages : 0}
                , startPageCalculated=${startPageOrig - endPageShortfall < 1 ? 1 : startPageOrig - endPageShortfall}
                , endPageCalculated=${endPageOrig + startPageShortfall > pageInfo.totalPages ? pageInfo.totalPages : endPageOrig + startPageShortfall}"
        >
            <div class="common-page-btn-to-start">
                <button
                    th:unless="${startPageCalculated == 1}"
                    class="common-page-btn"
                    th:text="1"
                    th:attr="data-curr-order=${currOrder}"
                    th:onclick="|showRewardConvertHistoryList(${affiliateId}, 1, ${pageInfo.pageSize}, this.dataset.currOrder)|"
                >
                </button>
                <span th:unless="${startPageCalculated == 1}">···</span>
            </div>
            <ul class="common-page-btn-list">
                <li
                    th:each="p : ${#numbers.sequence(startPageCalculated, endPageCalculated)}"
                    class="common-page-btn-item"
                >
                    <button
                        th:class="${p == pageInfo.currPage ? 'common-page-btn curr' : 'common-page-btn'}"
                        th:text="${p}"
                        th:attr="data-curr-order=${currOrder}"
                        th:onclick="|showRewardConvertHistoryList(${affiliateId}, ${p}, ${pageInfo.pageSize}, this.dataset.currOrder)|"
                    >
                    </button>
                </li>
            </ul>
            <div class="common-page-btn-to-end">
                <span th:unless="${endPageCalculated == pageInfo.totalPages}">···</span>
                <button
                    th:unless="${endPageCalculated == pageInfo.totalPages}"
                    class="common-page-btn"
                    th:text="${pageInfo.totalPages}"
                    th:attr="data-curr-order=${currOrder}"
                    th:onclick="|showRewardConvertHistoryList(${affiliateId}, ${pageInfo.totalPages}, ${pageInfo.pageSize}, this.dataset.currOrder)|"
                >
                </button>
            </div>
        </div>
    </div>
</div>
