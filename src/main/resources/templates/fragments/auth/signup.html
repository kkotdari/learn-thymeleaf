<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<form th:fragment="content" id="signup-form" class="signup-form">
    <div class="auth-inputs">
        <div class="common-input-with-label">
            <label for="username">아이디</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="common-input-with-label">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="common-input-with-label">
            <label for="passwordConfirm">비밀번호</label>
            <input type="password" id="passwordConfirm" name="passwordConfirm" required>
        </div>
    </div>
    <button class="common-button" type="submit">회원가입</button>
</form>

<script>
    document.getElementById('signup-form').addEventListener('submit', function (e) {
            e.preventDefault()

            const form = e.target
            const formData = new FormData(form)

            fetch('/login', {
                method: 'POST',
                body: formData
            })
                .then(res => {
                    if (!res.ok) {
                        throw new Error('Signup failed')
                    }
                    return res.text()
                })
                .then(html => {
                    document.getElementById('content-container').innerHTML = html
                })
                .catch(err => {
                    console.error('auth > signup > signup error: ', err)
                })
        }

    )
</script>
</body>
</html>
