<div th:fragment="content" class="auth">
    <div class="auth-box">
        <div class="auth-form-container">
            <th:block th:if="${tab} == 'login'">
                <div th:replace="~{fragments/auth/login :: content}"></div>
            </th:block>
            <th:block th:if="${tab} == 'signup'">
                <div th:replace="~{fragments/auth/signup :: content}"></div>
            </th:block>
        </div>
    </div>
</div>
