<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" id="header" class="header">
    <div th:if="${session.user == null}">
        <span class="header-text" onclick="route('auth/login')">
            로그인
        </span>
        <span>
            &nbsp;|&nbsp;
        </span>
        <span class="header-text" onclick="route('auth/signup')">
            회원가입
        </span>
    </div>
    <div th:if="${session.user != null}">
        <span class="header-text">[[${session.user.username}]]님 안녕하세요</span>
    </div>
</div>
</body>
</html>
